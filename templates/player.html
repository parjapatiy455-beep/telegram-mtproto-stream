<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{ file_name }} - MTProto Video Stream</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="/static/style.css?v=3.2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Inline Critical Styles to guarantee zero unstyled jumps -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #060910 !important;
            color: #f8fafc !important;
            min-height: 100vh;
        }
        a, a:visited, a:hover, a:active {
            text-decoration: none !important;
            color: inherit !important;
        }
        .player-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 1.25rem 1rem;
            width: 100%;
        }
        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.75rem 1.2rem;
            background: rgba(18, 24, 38, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
        }
        .btn-back {
            color: #94a3b8 !important;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s;
        }
        .btn-back:hover {
            color: #fff !important;
            background: rgba(255, 255, 255, 0.1);
        }
        .file-title-area {
            flex: 1;
            text-align: center;
            min-width: 180px;
            max-width: 60%;
            overflow: hidden;
        }
        .player-title {
            font-size: 0.98rem;
            font-weight: 600;
            color: #fff !important;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.15rem;
        }
        .file-meta-pill {
            display: inline-block;
            font-size: 0.74rem;
            color: #64748b;
            font-weight: 500;
        }
        .video-wrapper {
            width: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .video-wrapper video {
            width: 100%;
            max-height: 72vh;
            display: block;
            object-fit: contain;
            background: #000;
        }
        .player-details-card {
            background: rgba(18, 24, 38, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 1.4rem;
            margin-top: 1.25rem;
        }
        .player-details-card h3 {
            font-size: 0.96rem;
            color: #fff;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .player-link-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }
        @media (max-width: 768px) {
            .player-container {
                padding: 0.75rem 0.5rem;
            }
            .player-header {
                padding: 0.65rem 0.85rem;
                gap: 0.6rem;
            }
            .file-title-area {
                order: 3;
                max-width: 100%;
                width: 100%;
                text-align: left;
                margin-top: 0.25rem;
            }
            .player-link-grid {
                grid-template-columns: 1fr;
                gap: 0.85rem;
            }
        }
    </style>
</head>
<body class="player-body">
    <div id="toast-container" class="toast-container"></div>

    <div class="player-container">
        <!-- Top Navigation Bar -->
        <header class="player-header">
            <a href="/" class="btn-back">
                <i class="fas fa-arrow-left"></i> <span>Dashboard</span>
            </a>
            
            <div class="file-title-area">
                <h1 class="player-title" title="{{ file_name }}">{{ file_name }}</h1>
                <span class="file-meta-pill">{{ file_size_human }} &bull; {{ mime_type }}</span>
            </div>

            <a href="{{ download_url }}" class="btn btn-secondary btn-sm">
                <i class="fas fa-download"></i> <span>Download</span>
            </a>
        </header>

        <!-- Video Player Wrapper -->
        <div class="video-wrapper">
            <video id="player" playsinline controls preload="metadata">
                <source src="{{ stream_url }}" type="{{ mime_type }}" />
                Your browser does not support the video tag.
            </video>
        </div>

        <!-- Video Actions & Links Card -->
        <div class="player-details-card">
            <h3><i class="fas fa-share-alt" style="color: #0ea5e9;"></i> <span>Share & Stream Links</span></h3>
            
            <div class="player-link-grid">
                <div class="link-item">
                    <label style="display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.4rem; font-weight: 500;">
                        Direct Stream URL (Use in &lt;video&gt; tag):
                    </label>
                    <div class="copy-input-group">
                        <input type="text" id="stream-url-val" value="{{ stream_url }}" readonly>
                        <button onclick="copyElementText('stream-url-val')" class="btn btn-secondary btn-sm">
                            <i class="fas fa-copy"></i> Copy
                        </button>
                    </div>
                </div>

                <div class="link-item">
                    <label style="display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.4rem; font-weight: 500;">
                        HTML5 Iframe Embed Code:
                    </label>
                    <div class="copy-input-group">
                        <input type="text" id="embed-code-val" value='<iframe src="{{ embed_url }}" width="100%" height="480" frameborder="0" allowfullscreen></iframe>' readonly>
                        <button onclick="copyElementText('embed-code-val')" class="btn btn-secondary btn-sm">
                            <i class="fas fa-code"></i> Copy
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script src="/static/script.js?v=3.2"></script>
    <script>
        try {
            if (typeof Plyr !== 'undefined') {
                const player = new Plyr('#player', {
                    controls: [
                        'play-large',
                        'restart',
                        'rewind',
                        'play',
                        'fast-forward',
                        'progress',
                        'current-time',
                        'duration',
                        'mute',
                        'volume',
                        'captions',
                        'settings',
                        'pip',
                        'airplay',
                        'fullscreen'
                    ],
                    seekTime: 10
                });
            }
        } catch (e) {
            console.log('Plyr fallback to native controls:', e);
        }

        function copyElementText(id) {
            const input = document.getElementById(id);
            if (input) {
                copyRawText(input.value);
            }
        }
    </script>
</body>
</html>
